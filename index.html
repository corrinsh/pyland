<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PyLand · 零基础 Python 冒险</title>
<style>
:root{
  --ink:#2b2d42; --bg:#f7ecd4; --paper:#fffaf0;
  --red:#e63946; --teal:#2a9d8f; --gold:#ffb703; --blue:#457b9d;
  --code-bg:#1d3557; --code-fg:#a5f3fc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.7;
  min-height:100vh;
  background-image:radial-gradient(rgba(43,45,66,.06) 1.5px, transparent 1.5px);
  background-size:22px 22px;
}
#app{max-width:540px;margin:0 auto;padding:18px 14px 40px}
.mono{font-family:Consolas,"Courier New",monospace}

/* 像素卡片/按钮 */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 rgba(43,45,66,.85);padding:18px;margin-bottom:16px}
.btn{
  display:inline-block;background:var(--gold);color:var(--ink);
  border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 rgba(43,45,66,.85);
  padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .06s,box-shadow .06s;user-select:none;
}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 rgba(43,45,66,.85)}
.btn.primary{background:var(--red);color:#fff}
.btn.go{background:var(--teal);color:#fff}
.btn.ghost{background:var(--paper)}
.btn.small{padding:7px 14px;font-size:14px;box-shadow:3px 3px 0 rgba(43,45,66,.85)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* 顶部状态条 */
.statusbar{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 rgba(43,45,66,.85);padding:10px 14px;margin-bottom:16px}
.lvchip{background:var(--ink);color:var(--gold);font-weight:800;padding:4px 10px;border-radius:6px;font-size:13px;white-space:nowrap}
.xpwrap{flex:1}
.xpbar{height:16px;border:2.5px solid var(--ink);border-radius:5px;background:repeating-linear-gradient(90deg,#e8dcc0 0 8px,#f2e9d2 8px 16px);overflow:hidden;position:relative}
.xpfill{height:100%;background:repeating-linear-gradient(90deg,var(--teal) 0 8px,#3fb8a8 8px 16px);transition:width .5s}
.xptext{font-size:11.5px;font-weight:700;text-align:center;margin-top:2px;letter-spacing:.5px}
.badgecount{font-size:20px;filter:drop-shadow(2px 2px 0 rgba(43,45,66,.4))}

/* 封面 */
.cover{text-align:center;padding:44px 18px}
.cover .logo{font-size:44px;font-weight:900;letter-spacing:2px;color:var(--ink);text-shadow:4px 4px 0 var(--gold);margin-bottom:6px}
.cover .sub{font-size:15px;color:#5c5f7d;margin-bottom:26px}
.cover .hero-emoji{font-size:64px;margin:10px 0 18px}
.cover .tagline{font-size:13.5px;background:var(--paper);border:2.5px solid var(--ink);border-radius:8px;display:inline-block;padding:6px 14px;margin-bottom:26px}

/* 地图 */
.chapter-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chapter-no{background:var(--red);color:#fff;font-weight:800;border:3px solid var(--ink);border-radius:8px;padding:6px 12px;font-size:15px;box-shadow:3px 3px 0 rgba(43,45,66,.85)}
.chapter-title{font-size:18px;font-weight:800}
.chapter-sub{font-size:12.5px;color:#5c5f7d}
.level-node{
  display:flex;align-items:center;gap:12px;background:var(--paper);
  border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 rgba(43,45,66,.85);
  padding:12px 14px;margin-bottom:12px;cursor:pointer;position:relative;
}
.level-node:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(43,45,66,.85)}
.level-node.locked{opacity:.5;cursor:not-allowed;background:#e8ddc4}
.level-node.done{border-color:var(--teal)}
.node-icon{width:46px;height:46px;border:3px solid var(--ink);border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.node-icon.boss{background:var(--red)}
.node-icon.done{background:var(--teal)}
.node-body{flex:1;min-width:0}
.node-title{font-weight:800;font-size:15px}
.node-desc{font-size:12px;color:#5c5f7d}
.node-stars{font-size:13px;letter-spacing:2px;white-space:nowrap}
.node-lock{font-size:22px}
.path-line{width:4px;height:14px;background:repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 12px);margin:0 auto -6px auto;opacity:.35}
.locked-chapter{display:flex;align-items:center;gap:12px;opacity:.55;margin-bottom:16px}
.review-tag{position:absolute;top:-9px;right:10px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;border:2px solid var(--ink)}

/* 剧情/讲解 */
.story-who{display:inline-block;background:var(--blue);color:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:2px 10px;font-size:12.5px;font-weight:700;margin-bottom:10px}
.story-text{font-size:15px;margin-bottom:14px}
.teach-point{display:flex;gap:10px;margin-bottom:12px;font-size:14.5px}
.teach-dot{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:6px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:3px}
.code{
  background:var(--code-bg);color:var(--code-fg);border:3px solid var(--ink);border-radius:8px;
  padding:14px;font-family:Consolas,"Courier New",monospace;font-size:14.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-all;margin:10px 0;box-shadow:3px 3px 0 rgba(43,45,66,.5);
}
.code .cm{color:#7d8dbf}
.code .hl{background:var(--gold);color:var(--ink);padding:0 4px;border-radius:3px;font-weight:700}

/* 答题 */
.quiz-progress{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.q-dot{flex:1;height:10px;border:2px solid var(--ink);border-radius:4px;background:#e8dcc0;min-width:14px}
.q-dot.ok{background:var(--teal)}
.q-dot.miss{background:var(--red)}
.q-dot.cur{background:var(--gold)}
.q-type{display:inline-block;font-size:11px;font-weight:800;background:var(--ink);color:#fff;padding:2px 9px;border-radius:5px;margin-bottom:8px;letter-spacing:1px}
.q-text{font-size:15.5px;font-weight:700;margin-bottom:8px}
.opt{
  display:block;width:100%;text-align:left;background:var(--paper);
  border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 rgba(43,45,66,.7);
  padding:12px 14px;font-size:14.5px;margin-bottom:10px;cursor:pointer;font-family:inherit;
  transition:transform .06s;
}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,45,66,.7)}
.opt.right{background:var(--teal);color:#fff}
.opt.wrong{background:var(--red);color:#fff;animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.judge-row{display:flex;gap:14px;margin:14px 0}
.judge-btn{flex:1;padding:20px;font-size:19px;font-weight:800}
.judge-btn.right{background:var(--teal);color:#fff}
.judge-btn.wrong{background:var(--red);color:#fff;animation:shake .3s}
.blank-input{
  width:100%;border:3px solid var(--ink);border-radius:10px;padding:12px 14px;font-size:16px;
  font-family:Consolas,monospace;background:#fff;box-shadow:inset 2px 2px 0 rgba(43,45,66,.12);
}
.blank-hint{font-size:12.5px;color:#7a5a17;background:#fcf3df;border:2px dashed #b08a2e;padding:8px 12px;border-radius:8px;margin:6px 0 10px;display:flex;align-items:center;gap:6px}
.diff-box{margin-top:8px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff8e8}
.diff-title{font-weight:bold;color:#7a5a17;margin-bottom:6px;font-size:13.5px}
.diff-hint{font-size:12px;color:#5c4a17;background:#fcf3df;padding:6px 8px;border-radius:4px;margin-bottom:8px;border:1px dashed #b08a2e}
.diff-row{font-size:13px;padding:3px 0;line-height:1.5}
.diff-ok{color:#1d8b6a}
.diff-bad{color:#a02a4a;font-weight:600}
.diff-mono{font-family:ui-monospace,'JetBrains Mono',Menlo,monospace;font-size:12px;background:#f3f3f7;padding:4px 8px;border-radius:4px;margin:3px 0;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.diff-chars{font-size:12px;margin-top:4px;line-height:1.7}
.diff-got{display:inline-block;margin-right:6px;padding:2px 8px;background:#fbe0ea;border:1px solid #e63946;border-radius:4px;color:#a02a4a}
.diff-exp{display:inline-block;padding:2px 8px;background:#dff5e8;border:1px solid #2a9d8f;border-radius:4px;color:#1d6a4b}
.hist-row{border:3px solid var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:var(--paper)}
.hist-row.idle{opacity:.62;border-style:dashed}
.hist-date{font-size:13.5px;font-weight:800;margin-bottom:4px}
.hist-data{font-size:12.5px;color:#5c5f7d;line-height:1.6}
.stat-pill{flex:1;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;font-size:11.5px;color:#5c5f7d;background:#fff;text-align:center;white-space:nowrap;overflow:hidden}
.stat-pill b{color:var(--ink);font-size:13px}

/* 训练场 / 自由编码台 / Monaco 编辑器 */
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);padding:5px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 rgba(43,45,66,.6)}
.chip.on{background:var(--ink);color:var(--gold)}
.monaco-holder{border:3px solid var(--ink);border-radius:8px;overflow:hidden;margin:6px 0 4px;box-shadow:4px 4px 0 rgba(43,45,66,.15)}
.task-out.errbox{background:#fbe0e2;border-color:var(--red)}
.errbox .tb{display:block;margin-top:6px;font-family:Consolas,Menlo,monospace;font-size:11.5px;opacity:.7;white-space:pre-wrap;word-break:break-all;line-height:1.5}

/* 实操编程题（真代码执行） */
.task-out{font-size:13px;background:#fffdf5;border:3px solid var(--ink);border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;line-height:1.7;box-shadow:4px 4px 0 rgba(43,45,66,.12)}
.task-out.ok{background:#d8f3ec;border-color:var(--teal)}
.task-out .task-label{font-weight:800;font-size:11px;letter-spacing:2px;color:#5c5f7d;display:block;margin-bottom:2px}
.code-input{width:100%;min-height:130px;font-family:Consolas,Menlo,monospace;font-size:13.5px;line-height:1.8;border:3px solid var(--ink);border-radius:8px;padding:10px 12px;background:#fff;box-shadow:4px 4px 0 rgba(43,45,66,.15);box-sizing:border-box;resize:vertical;margin:6px 0 4px;color:var(--ink)}
.code-input:focus{outline:3px solid var(--gold)}
.order-line{
  display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);
  border-radius:10px;padding:10px 14px;margin-bottom:10px;cursor:pointer;font-family:Consolas,monospace;font-size:14px;
}
.order-line.picked{background:var(--gold)}
.order-line .slot{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}

/* 反馈 */
.feedback{border:3px solid var(--ink);border-radius:10px;padding:14px;margin-top:8px;animation:pop .25s}
.feedback.good{background:#d8f3ec;border-color:var(--teal)}
.feedback.bad{background:#fbe0e2;border-color:var(--red)}
.feedback .fb-title{font-weight:800;font-size:15px;margin-bottom:6px}
.feedback .fb-exp{font-size:13.5px}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.xp-float{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold);font-weight:900;font-size:22px;padding:8px 20px;border-radius:10px;border:3px solid var(--gold);z-index:99;animation:rise 1s forwards;pointer-events:none}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}

/* 结算 */
.result{text-align:center;padding:26px 18px}
.result-stars{font-size:46px;letter-spacing:6px;margin:8px 0}
.result-stars .off{opacity:.25}
.result-line{font-size:15px;margin:6px 0}
.xp-gain{display:inline-block;background:var(--ink);color:var(--gold);font-weight:800;padding:6px 18px;border-radius:8px;margin:10px 0;font-size:17px}

/* 徽章页 */
.badge-item{display:flex;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:var(--paper)}
.badge-item.off{opacity:.4;filter:grayscale(1)}
.badge-icon{width:48px;height:48px;border:3px solid var(--ink);border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.badge-name{font-weight:800;font-size:15px}
.badge-desc{font-size:12.5px;color:#5c5f7d}

/* 杂项 */
.screen-title{font-size:22px;font-weight:900;margin:4px 0 16px;text-shadow:3px 3px 0 rgba(255,183,3,.5)}
.nav-bar{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:99;animation:pop .25s;border:2px solid var(--gold)}
.sec-label{font-size:12px;font-weight:800;color:#5c5f7d;letter-spacing:2px;margin:18px 0 10px}
@media(max-width:420px){
  #app{padding:12px 10px 36px}
  .cover .logo{font-size:36px}
  .btn{padding:11px 18px;font-size:15px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   PyLand · 零基础 Python 冒险  V2（真代码执行版）
   ---------------------------------------------------------------------
   【给 Corrin 的话】想改/加题目，只动下面 COURSES 数据区就行。
   每关结构：{ id, title, icon, boss, story(剧情), teach(讲解数组),
              questions(题目数组) }
   题型：choice(单选) / judge(判断) / predict(预测输出)
         blank(填空) / order(代码排序) / code(实操编程·真代码执行)
   code 题字段：q(任务描述) / starter(起始代码，可省) /
                expected(期望输出，按行比对) / explain(解析)
   —— code 题靠 Pyodide（跑在浏览器里的真 Python 引擎）执行判定，
      需要联网，首次加载约 10MB，之后有缓存。
   UI 逻辑在下面 GAME 区，不用碰。
   ===================================================================== */

const LEVELS = [
  { lv:1, name:"代码学徒", xp:0 },
  { lv:2, name:"见习术士", xp:100 },
  { lv:3, name:"元素法师", xp:250 },
  { lv:4, name:"符文大师", xp:500 },
  { lv:5, name:"大魔导师", xp:800 },
];

const BADGES = [
  { id:"first_spell", icon:"✨", name:"第一句咒语", desc:"通过任意一关" },
  { id:"perfect_quiz", icon:"🎯", name:"全知全能", desc:"单关全部首答答对（3星）" },
  { id:"combo_5", icon:"🔥", name:"连击术士", desc:"连续首答答对 5 题" },
  { id:"boss_slayer", icon:"⚔️", name:"史莱姆克星", desc:"击败第一章 Boss" },
  { id:"chapter_done", icon:"👑", name:"章节征服者", desc:"通过第一章全部关卡" },
  { id:"two_days", icon:"📅", name:"勤修不辍", desc:"累计 2 天打开修炼" },
];

/* ===================== COURSES 数据区（可编辑） ===================== */

const COURSES = [
{
  id:"ch1", no:"第一章", title:"初识咒语",
  sub:"print · 变量 · input · 数据类型",
  levels:[
  {
    id:"l1", title:"第一句咒语", icon:"🗣️", boss:false,
    desc:"print()：让大陆听见你",
    story:"你踏进 PyLand 的入门村。村长格伦捋着胡子说：“每个代码术士的第一步，都是让大陆听见你的声音。来，念出你的第一句咒语——print。”",
    teach:[
      "print() 是让计算机说话的咒语。括号里放什么，屏幕就显示什么。这个括号和引号都必须是英文半角——中文的（）和「“”」计算机不认。",
      '想显示文字，要给文字加引号：print("你好")。引号里的内容叫「字符串」，空格、标点都会原样保留，显示时引号本身不会出现。',
      "单引号双引号都行：print('你好') 和 print(\"你好\") 效果一样，但必须成对——开头双结尾单会报错。",
      "想显示数字或算式，直接写：print(42) 或 print(3 + 4)——算式会先计算，再把结果显示出来。",
      "四则运算符长这样：+ 加、- 减、* 乘、/ 除。没有 × 和 ÷，乘除用星号和斜杠。乘除还遵循先乘除后加减：print(1 + 2 * 3) 是 7 不是 9。",
      "print() 自带换行：一次 print 显示完，光标自动跳到下一行。两个 print 就是两行，不用自己管换行。",
      "# 后面是注释：写给人看的笔记，计算机直接忽略。可以独占一行，也可以跟在代码后面。好注释是给三个月后的自己看的。",
      "Python 区分大小写：print 是咒语，Print / PRINT 都不认识——会报 NameError。",
      "括号里可以放多个东西，用逗号隔开：print(\"血量\", 100) 会显示「血量 100」——逗号的位置自动变空格。这招比 + 拼接省事，还不会报错。",
      "常见报错长相：SyntaxError 多半是引号/括号没配对，或者用了中文符号；NameError 多半是拼写错了（比如 Print）。",
      "新手心法：报错不可怕。看报错最后一行 + 检查引号括号是不是英文半角，八成的错自己就能修。",
    ],
    questions:[
      { type:"choice", q:"哪句咒语能让屏幕显示「你好，PyLand」？",
        options:['print("你好，PyLand")','Print("你好，PyLand")','print(你好，PyLand)','你好.print("PyLand")'],
        answer:0,
        explain:"B 的 Print 首字母大写了，Python 不认；C 的文字没加引号，计算机会当成代码名而报错；D 的顺序写反了。print 在前，内容在括号里。" },
      { type:"predict", code:'print("A")\nprint("B")', q:"运行后屏幕会显示什么？",
        options:["AB 挤在同一行","A 和 B 各占一行","只显示 A","直接报错"],
        answer:1,
        explain:"每个 print() 自带一次换行。想挤在同一行需要别的咒语，以后再学。" },
      { type:"blank", q:"补全咒语，让屏幕显示「出发！」", code:'___("出发！")', answer:"print",
        explain:"让计算机说话的咒语是 print，注意全小写。" },
      { type:"judge", q:"print() 每显示一次内容，最后都会自动换行。", answer:true,
        explain:"对，换行是 print 自带的默认行为，不用你操心。" },
      { type:"predict", code:'print(2 * 3)', q:"运行后屏幕会显示什么？",
        options:["6","23","2 * 3","报错"],
        answer:0,
        explain:"乘法用星号 *。print 里的算式先计算再显示，结果是 6。" },
      { type:"choice", q:"下面哪一行是 Python 的注释？",
        options:["// 这行是注释","# 这行是注释","print(注释)","/* 这行是注释 */"],
        answer:1,
        explain:"Python 用 # 号写注释。// 和 /* */ 是其他语言的写法。" },
      { type:"predict", code:'print(3 + 4)', q:"运行后屏幕会显示什么？",
        options:["3 + 4","7","3+4","报错"],

const SAVE_KEY = "pyland_save_v1";

let newBadgeQueue = [];

function defaultState(){
  return { xp:0, progress:{}, badges:[], days:[today()], maxCombo:0, combo:0, daily:{}, genSeen:[] };
}
function today(){ return new Date().toISOString().slice(0,10); }
/* ---- 每日统计：S.daily[日期] = { xp, first, wrong, pFirst, pWrong, runs, levels } ---- */
function dayStat(){
  const d = today();
  if(!S.daily) S.daily = {};
  if(!S.daily[d]) S.daily[d] = { xp:0, first:0, wrong:0, pFirst:0, pWrong:0, runs:0, levels:0 };
  return S.daily[d];
}
function bumpDay(key, n){
  dayStat()[key] = (dayStat()[key]||0) + (n||1);
  saveState();
}
function streakDays(){
  const set = new Set(S.days || []);
  let n = 0; const d = new Date();
  // 从今天（或昨天）往前数连续修炼天数
  if(!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    S = raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  }catch(e){ S = defaultState(); }
  if(!S.days.includes(today())) S.days.push(today());
  saveState();
}
function saveState(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function addXP(n){
  if(n<=0) return;
  S.xp += n;
  dayStat().xp += n;
  const el = document.createElement("div");
  el.className = "xp-float"; el.textContent = "+" + n + " XP";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
  saveState();
}
function curLevel(){
  let cur = LEVELS[0];
  for(const l of LEVELS){ if(S.xp >= l.xp) cur = l; }
  return cur;
}
function nextLevel(){ const i = LEVELS.indexOf(curLevel()); return LEVELS[i+1] || null; }
function levelPassed(lvId){ return S.progress[lvId] && S.progress[lvId].stars >= 1; }
function ch1AllDone(){ return COURSES[0].levels.every(l=>levelPassed(l.id)); }

function checkBadges(){
  const got = id => S.badges.includes(id);
  const add = id => { if(!got(id)){ S.badges.push(id); newBadgeQueue.push(id); } };
  if(Object.keys(S.progress).some(k=>S.progress[k].stars>=1)) add("first_spell");
  if(Object.keys(S.progress).some(k=>S.progress[k].stars===3)) add("perfect_quiz");
  if(S.maxCombo>=5) add("combo_5");
  if(levelPassed("l5")) add("boss_slayer");
  if(ch1AllDone()) add("chapter_done");
  if(S.days.length>=2) add("two_days");
  saveState();
}

/* ---------- Pyodide 真代码引擎 ---------- */
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
let pyodidePromise = null;
function getPyodide(){
  if(!pyodidePromise){
    pyodidePromise = new Promise((resolve,reject)=>{
      const s = document.createElement("script");
      s.src = PYODIDE_URL + "pyodide.js";
      s.onload = async ()=>{ try{ resolve(await loadPyodide({indexURL:PYODIDE_URL})); }catch(e){ pyodidePromise=null; reject(e); } };
      s.onerror = ()=>{ pyodidePromise=null; reject(new Error("引擎脚本加载失败")); };
      document.head.appendChild(s);
    });
  }
  return pyodidePromise;
}
async function runPythonCode(code){
  const py = await getPyodide();
  const lines = [];
  py.setStdout({batched:t=>lines.push(t)});
  py.setStderr({batched:t=>lines.push(t)});
  let err = null;
  const ns = py.globals.get("dict")();   // 每次独立命名空间，变量不互相污染
  try{ py.runPython(code, {globals:ns}); }
  catch(e){ err = String(e.message||e); }
  finally{ try{ ns.destroy(); }catch(_){} }
  return { out: lines.join("\n"), err };
}
const normOut = s => String(s).replace(/\r/g,"").split("\n").map(x=>x.replace(/[ \t　]+$/,"")).join("\n").replace(/^\n+/,"").replace(/\n+$/,"").replace(/\n{2,}/g,"\n");
// 给「看着一样但被判错」的情况：指出哪一行第几个字符不同，并标 Unicode 编码
const UNICODE_NAME = {
  0x2026:"中文省略号 …",0x002E:"英文点 .",0xFF0C:"中文逗号 ，",0x002C:"英文逗号 ,",
  0xFF01:"中文感叹号 ！",0x0021:"英文感叹号 !",0xFF1A:"中文冒号 ：",0x003A:"英文冒号 :",
  0x3000:"全角空格",0x0020:"半角空格",0xFF08:"中文括号 （",0x0028:"英文括号 (",
  0x005F:"下划线 _",0x002D:"短横线 -",0x002F:"斜杠 /",0x005C:"反斜杠 \\"
};
function describeChar(ch){
  const cp = ch.codePointAt(0);
  const hex = "U+" + cp.toString(16).toUpperCase().padStart(4,"0");
  if(UNICODE_NAME[cp]) return `${hex}「${ch}」（${UNICODE_NAME[cp]}）`;
  if(cp>=0x4E00 && cp<=0x9FFF) return `${hex}「${ch}」（汉字）`;
  return `${hex}「${ch}」`;
}
function diffOutput(exp, got){
  const a = normOut(exp), b = normOut(got);
  if(a === b) return null;
  const aL = a.split("\n"), bL = b.split("\n");
  const lines = [];
  const n = Math.max(aL.length, bL.length);
  for(let i=0;i<n;i++){
    const la = aL[i]||"", lb = bL[i]||"";
    if(la === lb){ lines.push({ok:true, row:i, text:la||"(空行)"}); continue; }
    // 找第一个不一致字符位置
    let p = 0;
    while(p < la.length && p < lb.length && la[p] === lb[p]) p++;
    // 长度差异也算「不同」
    const expCh = p < la.length ? la[p] : null;
    const gotCh = p < lb.length ? lb[p] : null;
    lines.push({ok:false, row:i, got:lb||"(空)", exp:la||"(空)", pos:p,
      expChar:expCh ? describeChar(expCh) : null,
      gotChar:gotCh ? describeChar(gotCh) : null,
      sameLen: la.length === lb.length});
  }
  // 提示看起来一样但字符不一样的常见情况
  const sameShape = a.replace(/\s/g,"") === b.replace(/\s/g,"");
  return { lines, expRaw: a, gotRaw: b, sameShape };
}

async function runCodeQ(){
  const q = run.qs[run.qIdx];
  const btn = document.getElementById("runBtn"), outBox = document.getElementById("codeOut");
  const code = document.getElementById("codeIn").value;
  if(!code.trim()) return;
  run.codeVal = code;               // 记住用户代码，重试不清空
  btn.disabled = true; btn.textContent = "⏳ 首次加载 Python 引擎约 10MB，稍等…";
  let res;
  try{ res = await runPythonCode(code); }
  catch(e){
    outBox.innerHTML = `<div class="feedback bad"><div class="fb-title">😵 引擎没连上</div><div class="fb-exp">真代码引擎（Pyodide）需要联网加载，请检查网络后点「再试一次」。</div></div>`;
    btn.disabled = false; btn.textContent = "▶ 运行咒语"; return;
  }
  btn.disabled = false; btn.textContent = "▶ 运行咒语";
  bumpDay("runs");
  if(res.err){
    const pe = parsePyError(res.err);
    clearErrMarks();
    if(pe.line) markErrLine(pe.line, (pe.type?pe.type+": ":"")+pe.message);
    outBox.innerHTML = errHTML(pe);
    return;
  }
  if(normOut(res.out) === normOut(q.expected)){
    outBox.innerHTML = `<div class="task-out ok"><span class="task-label">✅ 输出正确</span>${esc(res.out || "(无输出)")}</div>`;
    settle(true, q);
  } else {
    run.retried = true;             // 已经看过真实输出，再对就不算首答
    const diff = diffOutput(q.expected, res.out || "");
    let diffHTML = "";
    if(diff){
      diffHTML = `<div class="diff-box"><div class="diff-title">🔍 哪里不一样</div>`;
      if(diff.sameShape) diffHTML += `<div class="diff-hint">⚠ 看起来几乎一样——多半是<b>全角/半角</b>或<b>中文/英文标点</b>不同。看下面的字符编码就能看清。</div>`;
      for(const ln of diff.lines){
        if(ln.ok){
          diffHTML += `<div class="diff-row diff-ok">第 ${ln.row+1} 行：✓「${esc(ln.text||"(空行)")}」</div>`;
        } else {
          diffHTML += `<div class="diff-row diff-bad">第 ${ln.row+1} 行不一致（从第 ${ln.pos+1} 个字起）</div>`;
          diffHTML += `<div class="diff-mono">你写的：${esc(ln.got)}</div>`;
          diffHTML += `<div class="diff-mono">期望的：${esc(ln.exp)}</div>`;
          const tags = [];
          if(ln.gotChar) tags.push(`<span class="diff-got">你的字：${esc(ln.gotChar)}</span>`);
          if(ln.expChar) tags.push(`<span class="diff-exp">期望字：${esc(ln.expChar)}</span>`);
          if(tags.length) diffHTML += `<div class="diff-chars">${tags.join(" ")}</div>`;
        }
      }
      diffHTML += `</div>`;
    }
    outBox.innerHTML = `<div class="task-out"><span class="task-label">你的输出（和期望不一致，改完可再运行）</span>${esc(res.out || "(无输出)")}</div>` + diffHTML;
    settle(false, q, true);
  }
}

    </div>`;
}
function retryQ(){ run.retried = true; renderQuiz(); }

function pickOpt(i){
  const q = run.qs[run.qIdx];
  const btns = q.options.map((_,j)=>document.getElementById("opt"+j));
  btns.forEach(b=>b.disabled = true);
  if(i===q.answer){
    btns[i].classList.add("right");
    settle(true, q);
  } else {
    btns[i].classList.add("wrong");
    settle(false, q, true);
  }
}
function pickJudge(v){
  const q = run.qs[run.qIdx];
  if(v===q.answer){
    document.getElementById(v?"jT":"jF").classList.add("right");
    document.getElementById(v?"jF":"jT").style.display="none";
    settle(true, q);
  } else {
    document.getElementById(v?"jT":"jF").classList.add("wrong");
    settle(false, q, true);
  }
}
function submitBlank(){
  const q = run.qs[run.qIdx];
  const clean = s => String(s).trim().toLowerCase().replace(/["'\s,;:]/g,"");
  const val = clean(document.getElementById("blankIn").value);
  if(!val) return;
  const ans = clean(q.answer);
  // 宽松匹配：答案作为「独立片段」出现在输入里即判对——前后是非标识符字符（或边界）。
  // 这样整句写全也能认出来，同时避免 printprint 这种粘连误中。
  const esc = ans.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const ok = val === ans || new RegExp("(^|[^a-z0-9_])" + esc + "($|[^a-z0-9_])").test(val);
  if(ok) settle(true, q);
  else settle(false, q, true);
}
function pickOrder(i){
  if(run.orderSel.includes(i)) { run.orderSel = run.orderSel.filter(x=>x!==i); }
  else run.orderSel.push(i);
  const q = run.qs[run.qIdx];
  q.lines.forEach((_,j)=>{
    const idx = run.orderSel.indexOf(j);
    document.getElementById("ord"+j).classList.toggle("picked", idx>-1);
    document.getElementById("slot"+j).textContent = idx>-1 ? (idx+1) : "";
  });
  document.getElementById("ordSubmit").disabled = run.orderSel.length !== q.lines.length;
}
function resetOrder(){ run.orderSel = []; renderQuiz(); }
function submitOrder(){
  const q = run.qs[run.qIdx];
  if(run.orderSel.join(",") === q.answer.join(",")) settle(true, q);
  else settle(false, q, true);
}

function settle(ok, q, wrong){
  if(ok){
    run.results[run.qIdx] = { firstTry: !run.retried };
    if(!run.answered){
      run.answered = true;
      bumpDay(run.practice ? "pFirst" : "first");
      if(!run.review && !run.practice){
        if(!run.retried){ S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); addXP(10); }
        else { S.combo = 0; addXP(5); }
        saveState();
      }
    }
    feedback(true, q.explain);
  } else {
    run.results[run.qIdx] = { firstTry:false };
    bumpDay(run.practice ? "pWrong" : "wrong");
    if(!run.practice){ S.combo = 0; saveState(); }
    feedback(false, q.explain);
    if(q.type==="order"){
      const right = q.answer.map(i=>esc(q.lines[i])).join("  →  ");
      document.getElementById("fb").querySelector(".fb-exp").innerHTML += `<br><b>正确顺序：</b><span class="mono">${right}</span>`;
    }
  }
}
function nextQ(){
  if(run.qIdx + 1 < run.qs.length){
    run.qIdx++; run.retried = false; run.answered = false; run.orderSel = []; run.codeVal = undefined;
    renderQuiz();
  } else finishLevel();
}

function finishLevel(){
  disposeEditor();
  if(run.practice) return renderPracticeDone();
  const l = findLevel(run.id);
  const first = run.results.filter(r=>r && r.firstTry).length;
  const total = l.questions.length;
  const pct = first/total;
  const stars = pct===1 ? 3 : pct>=0.7 ? 2 : 1;
  let gained = 0, gainLines = [];
  const prev = S.progress[run.id] || {stars:0};
  if(!run.review){
    gained += 30; gainLines.push("通关奖励 +30");
    bumpDay("levels");
    if(stars===3){ gained += 20; gainLines.push("满分三星 +20"); }
    else if(stars===2){ gained += 10; gainLines.push("两星奖励 +10"); }
    if(stars > prev.stars) S.progress[run.id] = { stars };
    else if(!S.progress[run.id]) S.progress[run.id] = { stars };
  }
  newBadgeQueue = [];
  checkBadges();
  if(gained>0) addXP(gained);
  const starHTML = [1,2,3].map(i=>`<span class="${i<=stars?"":"off"}">★</span>`).join("");
  const badgeHTML = newBadgeQueue.length ? newBadgeQueue.map(id=>{
    const b = BADGES.find(x=>x.id===id);
    return `<div class="badge-item" style="margin-top:12px"><div class="badge-icon">${b.icon}</div>
      <div><div class="badge-name">${b.name}</div><div class="badge-desc">新徽章解锁！${b.desc}</div></div></div>`;
  }).join("") : "";
  const isBoss = l.boss;
  app.innerHTML = `
  ${renderStatusbar()}
  <div class="card result">
    <div style="font-size:15px;font-weight:800">${isBoss?"⚔️":"🏁"} ${l.title} · 试炼完成</div>
    <div class="result-stars">${starHTML}</div>
    <div class="result-line">首答答对 <b>${first} / ${total}</b>${run.review?" · 复习模式（不计 XP）":""}</div>
    ${gained>0?`<div class="xp-gain">+${gained} XP</div><div style="font-size:12.5px;color:#5c5f7d">${gainLines.join(" · ")}</div>`:`<div style="font-size:12.5px;color:#5c5f7d;margin:8px 0">复习模式，巩固记忆中 💪</div>`}
    ${badgeHTML}
    <div class="btn-row">
      <button class="btn go" onclick="go('map')">返回地图 🗺️</button>
      ${run.review?`<button class="btn ghost" onclick="startLevel(run.id)">再来一遍 ↺</button>`:""}
    </div>
  </div>`;
  checkBadges();
  saveState();
}

/* ---------- Monaco（VS Code 编辑器内核，CDN 懒加载） ---------- */
const MONACO_URL = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min";
let monacoPromise = null;
let ED = null;      // 当前 Monaco 编辑器实例
function getMonaco(){
  if(!monacoPromise){
    monacoPromise = new Promise((resolve,reject)=>{
      const s = document.createElement("script");
      s.src = MONACO_URL + "/loader.js";
      s.onload = ()=>{
        try{
          window.MonacoEnvironment = {
            getWorkerUrl: () => URL.createObjectURL(new Blob([
              "self.MonacoEnvironment={baseUrl:'" + MONACO_URL + "/'};importScripts('" + MONACO_URL + "/vs/base/worker/workerMain.js');"
            ], {type:"text/javascript"}))
          };
          window.require.config({ paths:{ vs: MONACO_URL + "/vs" } });
          window.require(["vs/editor/editor.main"], ()=>{
            try{
              window.monaco.editor.defineTheme("pyland", {
                base:"vs-dark", inherit:true, rules:[],
                colors:{
                  "editor.background":"#1d3557",
                  "editorLineNumber.foreground":"#7d8dbf",
                  "editor.lineHighlightBackground":"#26456e",
                  "editorGutter.background":"#1a2c49",
                }
              });
            }catch(e){}
            resolve(window.monaco);
          }, e=>{ monacoPromise=null; reject(e); });
        }catch(e){ monacoPromise=null; reject(e); }
      };
      s.onerror = ()=>{ monacoPromise=null; reject(new Error("编辑器加载失败")); };
      document.head.appendChild(s);
    });
  }
  return monacoPromise;
}
function disposeEditor(){ if(ED){ try{ ED.dispose(); }catch(e){} ED = null; } }
// 把普通 textarea 平滑升级成 Monaco 编辑器（加载失败就继续用 textarea，功能不受影响）
async function upgradeToMonaco(taId){
  try{
    const monaco = await getMonaco();
    const ta = document.getElementById(taId);
    if(!ta || ta.dataset.upgraded) return;
    ta.dataset.upgraded = "1";
    const holder = document.createElement("div");
    holder.className = "monaco-holder";
    holder.style.height = Math.max(160, 26 + ta.value.split("\n").length * 21) + "px";
    ta.style.display = "none";
    ta.parentNode.insertBefore(holder, ta);
    disposeEditor();
    ED = monaco.editor.create(holder, {
      value: ta.value, language: "python", theme: "pyland",
      fontSize: 14, minimap:{enabled:false}, automaticLayout:true,
      wordWrap:"on", scrollBeyondLastLine:false, folding:false,
      tabSize:4, insertSpaces:true, overviewRulerLanes:0,
      lineNumbers:"on", lineNumbersMinChars:3, renderLineHighlight:"line",
      wordBasedSuggestions:false, occurrencesHighlight:false, quickSuggestions:false,
      scrollbar:{ verticalScrollbarSize:8, horizontalScrollbarSize:8 },
      padding:{top:8},
    });
    ED.onDidChangeModelContent(()=>{ ta.value = ED.getValue(); });
  }catch(e){ /* 网页版编辑器加载失败，退回 textarea，照样能做题 */ }
}
function clearErrMarks(){
  if(ED && window.monaco){ try{ window.monaco.editor.setModelMarkers(ED.getModel(),"pyland",[]); }catch(e){} }
}
function markErrLine(line, msg){
  if(!ED || !window.monaco || !line) return;
  try{
    window.monaco.editor.setModelMarkers(ED.getModel(),"pyland",[{
      startLineNumber:line, startColumn:1, endLineNumber:line, endColumn:200,
      message:msg||"这一行出了问题", severity:window.monaco.MarkerSeverity.Error,
    }]);
    ED.revealLineInCenter(line);
    ED.setPosition({lineNumber:line, column:1});
  }catch(e){}
}

/* ---------- Python 报错解析：定位到行 + 错误类型 ---------- */
function parsePyError(msg){
  const raw = String(msg||"").trim();
  const lines = raw.split("\n");
  let line = null;
  // 取 traceback 里最后一次出现的行号（最贴近出错位置的栈帧）
  for(const ln of lines){ const m = ln.match(/line (\d+)/); if(m) line = +m[1]; }
  const last = lines[lines.length-1] || "";
  let type = null, message = last;
  const tm = last.match(/^([A-Za-z_][\w.]*(?:Error|Exception|Exit|Interrupt))\s*:\s*(.*)/);
  if(tm){ type = tm[1]; message = tm[2]; }
  else { const tm2 = last.match(/^([\w.]+Error)\b/); if(tm2){ type = tm2[1]; } }
  return { type, message, line, raw };
}
function errHTML(pe, extraNote){
  let head = "💥 报错" + (extraNote||"（不扣分，改完再运行）");
  if(pe.line) head += ` · 第 ${pe.line} 行`;
  if(pe.type) head += ` · ${pe.type}`;
  return `<div class="task-out errbox"><span class="task-label">${head}</span>${esc(pe.message||"")}` +
    (pe.raw ? `<span class="tb">${esc(pe.raw.split("\n").slice(-8).join("\n"))}</span>` : "") + `</div>`;
}

function shuffleArr(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}

   出题时优先避开「最近 60 条」里出现过的题 → 重刷重复率压在 20% 以下。
   ===================================================================== */
const ri = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

const PY_KEYWORDS = ["print","if","int","str","class","for","input","else"];
const pyFloat = n => Number.isInteger(n) ? n + ".0" : String(n);   // Python 的 10/2 显示 5.0
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return String(h); }

/* 造四个选项：正确答案 + 干扰项，乱序后返回 { options, answer } */
function mkOpts(correct, wrongs){
  const opts = [String(correct)];
  for(const w of wrongs){ const s = String(w); if(!opts.includes(s) && opts.length<4) opts.push(s); }
  const pads = ["报错","以上都不对","不知道"];
  for(const p of pads){ if(opts.length>=4) break; if(!opts.includes(p)) opts.push(p); }
  const shuffled = shuffleArr(opts.map((o,i)=>({o,i})));
  return { options: shuffled.map(x=>x.o), answer: shuffled.findIndex(x=>x.i===0) };
}

}},

/* 生成一批不重复的新题。mode: all | theory | code */
function genBatch(mode, n){
  const pool = GEN_TPL.filter(t => mode==="all" || t.kind===mode);
  const recent = new Set((S.genSeen||[]).slice(-60));   // 最近 60 题的指纹：尽量避开
  const out = [], usedHash = new Set(), tplCount = {};
  let guard = 0;
  while(out.length < n && guard < n*30){
    guard++;
    const t = pick(pool);
    if((tplCount[t.id]||0) >= 3) continue;              // 同一模板一批最多出 3 次
    const q = t.gen();
    q.genHash = hashStr(t.id + "|" + JSON.stringify(q).replace(/("genHash":.*?,)/,""));
    if(usedHash.has(q.genHash)) continue;
    // 最近做过的不优先；实在生成不出来才允许重复（保证能出满 n 题）
    if(recent.has(q.genHash) && guard < n*20) continue;
    usedHash.add(q.genHash);
    tplCount[t.id] = (tplCount[t.id]||0) + 1;
    out.push(q);
  }
  S.genSeen = (S.genSeen||[]).concat(out.map(q=>q.genHash)).slice(-120);
  saveState();
  return out;
}

async function runPlayground(){

  try{ localStorage.setItem("pyland_playground", code); }catch(e){}
  btn.disabled = true; btn.textContent = "⏳ 运行中…";
  let res;
  try{ res = await runPythonCode(code); }
  catch(e){
    outBox.innerHTML = `<div class="feedback bad"><div class="fb-title">😵 引擎没连上</div><div class="fb-exp">真代码引擎（Pyodide）需要联网加载（首次约 10MB，之后有缓存），请检查网络再试。</div></div>`;

  }
  btn.disabled = false; btn.textContent = "▶ 运行";
  bumpDay("runs");
  clearErrMarks();
  if(res.err){
    const pe = parsePyError(res.err);
    if(pe.line) markErrLine(pe.line, (pe.type?pe.type+": ":"")+pe.message);
    outBox.innerHTML = errHTML(pe, "");
  } else {
    outBox.innerHTML = `<div class="task-out ok"><span class="task-label">✅ 运行成功</span>${esc(res.out || "(没有输出。想看到结果要用 print() 把内容打出来)")}</div>`;
  }
}

/* ---------- 📈 历史进度（每日统计） ---------- */
function fmtDate(ds){
  const d0 = today();
  const yd = new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(ds===d0) return "今天";
  if(ds===yd) return "昨天";
  const wd = ["日","一","二","三","四","五","六"];
  const d = new Date(ds+"T12:00:00");
  return `${d.getMonth()+1}月${d.getDate()}日 · 周${wd[d.getDay()]}`;
}
function renderHistory(){
  const daily = S.daily || {};
  const days = Object.keys(daily).sort().reverse();
  // 最近 14 天 XP 柱状图
  const last14 = [];
  for(let i=13;i>=0;i--){
    const ds = new Date(Date.now()-i*864e5).toISOString().slice(0,10);
    last14.push({ ds, xp: (daily[ds]||{}).xp||0 });
  }
  const maxXp = Math.max(10, ...last14.map(d=>d.xp));
  const bars = last14.map(d=>{
    const h = Math.round(d.xp/maxXp*100);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">
      <div style="font-size:9px;color:${d.xp?"#5c5f7d":"#c3c5d8"}">${d.xp||""}</div>
      <div style="width:70%;max-width:26px;height:64px;display:flex;align-items:flex-end">
        <div style="width:100%;height:${Math.max(h,d.xp?8:3)}%;border-radius:3px 3px 0 0;background:${d.xp?"linear-gradient(180deg,#ffb703,#e63946)":"#ececf4"}"></div>
      </div>
      <div style="font-size:9px;color:#8a8ca8;white-space:nowrap">${fmtDate(d.ds).replace(" · 周","")}</div>
    </div>`;
  }).join("");
  // 汇总
  const tot = days.reduce((a,ds)=>{ const d=daily[ds]||{};
    a.xp+=d.xp||0; a.first+=d.first||0; a.wrong+=d.wrong||0; a.pFirst+=d.pFirst||0; a.pWrong+=d.pWrong||0; a.runs+=d.runs||0; return a; },
    {xp:0,first:0,wrong:0,pFirst:0,pWrong:0,runs:0});
  const attempted = tot.first+tot.wrong;
  const acc = attempted ? Math.round(tot.first/attempted*100) : 0;
  // 每日明细（最近 30 天，空日子不显示）
  const rows = days.slice(0,30).map(ds=>{
    const d = daily[ds]||{};
    const att = (d.first||0)+(d.wrong||0);
    const dacc = att ? Math.round((d.first||0)/att*100) : null;
    const parts = [];
    if(d.xp) parts.push(`+${d.xp} XP`);
    if(att) parts.push(`闯关 ${d.first}/${att} 首答对${dacc!==null?`（${dacc}%）`:""}`);
    if((d.pFirst||0)+(d.pWrong||0)) parts.push(`练习 ${(d.pFirst||0)}/${(d.pFirst||0)+(d.pWrong||0)} 首答对`);
    if(d.runs) parts.push(`代码运行 ${d.runs} 次`);
    if(d.levels) parts.push(`通关 ${d.levels} 关`);
    const busy = parts.length > 0;
    return `<div class="hist-row ${busy?"":"idle"}">
      <div class="hist-date">${fmtDate(ds)}<span style="font-size:10px;color:#a0a2b8;margin-left:6px">${ds}</span></div>
      <div class="hist-data">${busy ? parts.join(" · ") : "只来逛了逛（做题从今天开始也不迟 💪）"}</div>
    </div>`;
  }).join("");
  app.innerHTML = `
  ${renderStatusbar()}
  <div class="screen-title">📈 历史进度</div>
  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:6px">
      <div class="stat-pill">🔥 连续修炼 <b>${streakDays()}</b> 天</div>
      <div class="stat-pill">📅 累计 <b>${(S.days||[]).length}</b> 天</div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div class="stat-pill">总答题 <b>${attempted}</b> 题</div>
      <div class="stat-pill">闯关首答正确率 <b>${attempted?acc+"%":"—"}</b></div>
      <div class="stat-pill">代码运行 <b>${tot.runs}</b> 次</div>
    </div>
    <div style="font-size:13px;font-weight:800;margin:4px 0 8px">最近 14 天 XP</div>
    <div style="display:flex;align-items:flex-end">${bars}</div>
  </div>
  <div class="card">
    <div style="font-size:13px;font-weight:800;margin-bottom:6px">每日明细</div>
    ${rows || `<div style="font-size:13px;color:#8a8ca8;padding:8px 0">还没有记录——去闯一关或做几道练习，今天就出现在这里。</div>`}
  </div>
  <div class="nav-bar"><button class="btn small ghost" onclick="go('map')">← 返回地图</button></div>`;
}

function exportSave(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pyland-save-" + today() + ".json";
  a.click();
  toast("存档已导出");
}
function importSave(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(typeof data.xp !== "number") throw 0;
      S = Object.assign(defaultState(), data);
      saveState(); go("map"); toast("存档导入成功");
    }catch(e){ toast("存档文件不对，导入失败"); }
  };
  r.readAsText(f);
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
